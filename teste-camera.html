<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a5c6ff" />
    <link rel="icon" href="icone.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>Teste de câmera | Gôndula Reader</title>
  </head>
  <body>
    <main class="aplicativo">
      <header class="cabecalho">
        <div class="marca">
          <span class="marca__icone" aria-hidden="true">✓</span>
          <div>
            <p class="marca__nome">Gôndula Reader</p>
            <p class="marca__subtitulo">Teste de foco da câmera</p>
          </div>
        </div>
      </header>

      <section class="leitura teste-camera" aria-labelledby="titulo-teste-camera">
        <p class="etiqueta">DIAGNÓSTICO AO VIVO</p>
        <h1 id="titulo-teste-camera">Teste a leitura do código</h1>
        <p>Ative a câmera, aproxime um código de barras e ajuste o zoom sem encostar o celular na etiqueta.</p>

        <button class="botao botao--principal" id="botao-ativar-camera" type="button">Ativar câmera</button>

        <div class="camera" id="camera-teste" hidden>
          <div class="camera__viewport">
            <video id="video-teste" playsinline autoplay muted></video>
            <div class="camera__overlay" aria-hidden="true">
              <div class="camera__viewfinder"></div>
            </div>
          </div>

          <div class="camera__foco">
            <button class="botao botao--texto" type="button" data-camera-refocar disabled>Refocar</button>
            <p data-camera-status role="status"></p>
          </div>
          <div class="teste-camera__controles" id="controles-zoom" hidden>
            <label for="controle-zoom">Zoom</label>
            <input id="controle-zoom" type="range" step="0.1" />
            <output id="valor-zoom" for="controle-zoom"></output>
          </div>

          <dl class="teste-camera__dados" id="dados-camera"></dl>
          <button class="botao botao--texto" id="botao-fechar-teste" type="button">Fechar câmera</button>
        </div>
        <p class="teste-camera__status" id="status-camera" role="status"></p>
      </section>
    </main>
    <script type="module" src="js/teste-camera.js"></script>
  </body>
</html>
