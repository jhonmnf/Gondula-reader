<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a5c6ff" />
    <meta name="description" content="Conferência de etiquetas de gôndula." />
    <link rel="icon" href="icone.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>Gôndula Reader</title>
  </head>
  <body>
    <main class="aplicativo" aria-live="polite">
      <header class="cabecalho">
        <div class="marca">
          <span class="marca__icone" aria-hidden="true">✓</span>
          <div>
            <p class="marca__nome">Gôndula Reader</p>
            <p class="marca__subtitulo">Conferência de Etiquetas</p>
          </div>
        </div>
        <button class="botao-icone" id="botao-sair" type="button" aria-label="Sair">⌧</button>
      </header>

      <section class="boas-vindas" id="estado-inicial">
        <p class="etiqueta">LOJA FÍSICA</p>
        <p>Leia o código ou realize a busca manual.</p>
      </section>

      <section class="leitura" id="leitura" aria-labelledby="titulo-leitura">
        <h2 id="titulo-leitura">Leitura</h2>
        <button class="botao botao--principal" id="botao-camera" type="button">
          <span aria-hidden="true">▣</span> Abrir câmera
        </button>
        <div class="camera" id="camera" hidden>
          <div class="camera__viewport">
            <video id="video" playsinline autoplay muted></video>
            <div class="camera__overlay">
              <div class="camera__viewfinder">
                <div class="camera__line"></div>
              </div>
              <div class="camera__tracking-box" id="tracking-box" hidden></div>
            </div>
          </div>
          <p>Aponte para o código de barras.</p>
          <button class="botao botao--texto" id="botao-fechar-camera" type="button">Fechar câmera</button>
        </div>
        <div class="divisor"><span>ou</span></div>
        <form id="formulario-busca" class="busca">
          <label for="campo-busca">Código ou nome do produto</label>
          <div class="busca__linha">
            <input id="campo-busca" autocomplete="off" inputmode="search" placeholder="Ex.: 74111" />
            <button type="submit" aria-label="Buscar">⌕</button>
          </div>
        </form>
      </section>

      <section class="lista-resultados" id="lista-resultados" hidden aria-labelledby="titulo-resultados">
        <h2 id="titulo-resultados">Resultados</h2>
        <div class="resultados-grade" id="resultados-grade"></div>
        <button class="botao botao--texto" id="botao-voltar-busca" type="button">← Voltar</button>
      </section>

      <section class="produto" id="produto" hidden aria-labelledby="nome-produto">
        <div class="produto__topo">
          <span class="produto__status">PREÇO OFICIAL</span>
          <span class="produto__codigo" id="codigo-produto"></span>
        </div>
        <h2 id="nome-produto"></h2>
        <p class="produto__detalhe" id="detalhe-produto"></p>
        <p class="produto__preco" id="preco-produto"></p>
        <div class="acoes" aria-label="Resultado da conferência">
          <button class="acao acao--correta" data-status="correta" type="button">✓ Correta</button>
          <button class="acao acao--divergente" data-status="divergente" type="button">! Divergente</button>
          <button class="acao acao--ausente" data-status="ausente" type="button">⊘ Ausente</button>
        </div>
        <button class="botao botao--texto" id="botao-voltar-produto" type="button">← Voltar</button>
      </section>

      <p id="mensagem" class="mensagem" role="status"></p>
    </main>

    <dialog class="modal" id="modal-admin" aria-labelledby="titulo-admin">
      <form method="dialog" id="formulario-admin">
        <button class="modal__fechar" id="botao-fechar-admin" type="button" aria-label="Fechar">×</button>
        <p class="etiqueta">ACESSO RESTRITO</p>
        <h2 id="titulo-admin">Sair do sistema</h2>
        <p>Credenciais do administrador.</p>
        <label for="usuario-admin">Usuário</label>
        <input id="usuario-admin" autocomplete="username" required />
        <label for="senha-admin">Senha</label>
        <input id="senha-admin" type="password" autocomplete="current-password" required />
        <p class="erro" id="erro-admin" role="alert"></p>
        <button class="botao botao--principal" type="submit">Autorizar</button>
      </form>
    </dialog>

    <section class="tela-encerrada" id="tela-encerrada" hidden>
      <span aria-hidden="true">✓</span>
      <h1>Operação encerrada</h1>
      <p>Acesso autorizado.</p>
      <button class="botao botao--principal" id="botao-retomar" type="button">Retomar conferência</button>
    </section>
    <script src="https://unpkg.com/@zxing/browser@0.1.5"></script>
    <script src="app.js"></script>
  </body>
</html>
